name: build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nsis
          go install github.com/akavel/rsrc@v0.10.2

      - name: Version
        id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          scripts/build.sh "${{ steps.v.outputs.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: pettracker-${{ steps.v.outputs.version }}
          path: dist/*

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.v.outputs.version }}"
          if gh release view "v$V" >/dev/null 2>&1; then
            gh release upload "v$V" "dist/PetTracker-Setup-$V.exe" dist/PetTracker.exe --clobber
          else
            gh release create "v$V" "dist/PetTracker-Setup-$V.exe" dist/PetTracker.exe \
              --title "Pet Tracker $V" --generate-notes
          fi
