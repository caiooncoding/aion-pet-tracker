name: build

# Every push builds and tests. When VERSION changes to a number that has no
# release yet, the push to master also publishes "vX.Y.Z" with the installer.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nsis zip
          go install github.com/akavel/rsrc@v0.10.2

      - name: Version
        id: v
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          scripts/build.sh "${{ steps.v.outputs.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: pettracker-${{ steps.v.outputs.version }}
          path: dist/*

      - name: Release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.v.outputs.version }}"
          if gh release view "v$V" >/dev/null 2>&1; then
            echo "v$V already released, skipping"
            exit 0
          fi
          gh release create "v$V" "dist/PetTracker-Setup-$V.exe" "dist/PetTracker-$V-portable.zip" \
            --target "$GITHUB_SHA" --title "Pet Tracker $V" --notes-file .github/release-notes.md
