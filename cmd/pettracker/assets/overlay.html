<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pet Tracker</title>
<style>
  :root {
    --bg: #0f151b;
    --panel: #151d25;
    --line: #243241;
    --text: #e8eef3;
    --muted: #8a99a8;
    --accent: #4fd1b5;
    --track: #223040;
    --max: #6b7a8a;
    --warn: #e0a85a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 13px/1.3 "Segoe UI", system-ui, sans-serif; overflow: hidden; user-select: none; }
  .app { display: flex; flex-direction: column; height: 100%; }
  header { display: flex; align-items: center; gap: 8px; padding: 10px 12px 8px; }
  h1 { font-size: 15px; font-weight: 600; margin: 0; flex: 1; letter-spacing: .2px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--max); flex: none; }
  .dot.live { background: var(--accent); box-shadow: 0 0 6px var(--accent); }
  label.hide { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; cursor: pointer; }
  label.hide input { accent-color: var(--accent); margin: 0; }
  .tabs { display: flex; gap: 6px; padding: 0 12px 8px; }
  .tab { flex: 1; padding: 6px 0; border-radius: 6px; border: 1px solid var(--line); background: transparent;
    color: var(--muted); font: inherit; cursor: pointer; }
  .tab.on { background: var(--accent); border-color: var(--accent); color: #062a22; font-weight: 600; }
  .search { margin: 0 12px 8px; padding: 6px 9px; border-radius: 6px; border: 1px solid var(--line);
    background: var(--panel); color: var(--text); font: inherit; outline: none; display: none; }
  .search.show { display: block; }
  .list { flex: 1; overflow-y: auto; padding: 0 8px 8px; }
  .list::-webkit-scrollbar { width: 6px; } .list::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }
  .row { display: grid; grid-template-columns: 44px 1fr auto; gap: 3px 10px; align-items: center;
    padding: 8px 6px; border-bottom: 1px solid var(--line); }
  .row.flash { animation: flash 1.2s ease-out; }
  @keyframes flash { from { background: #1f4a42; } to { background: transparent; } }
  .icon { grid-row: span 3; width: 44px; height: 44px; border-radius: 6px; background: var(--panel) center/cover no-repeat;
    display: grid; place-items: center; color: var(--muted); font-size: 18px; }
  .name { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .count { font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; }
  .sub { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hint { color: var(--muted); font-size: 12px; text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .hint.near { color: var(--warn); }
  .bar { grid-column: 2 / 4; height: 4px; border-radius: 2px; background: var(--track); overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); border-radius: 2px; transition: width .4s; }
  .row.max .name, .row.max .sub { color: var(--max); }
  .chip { font-size: 11px; font-weight: 700; padding: 2px 6px; border-radius: 4px; background: var(--track); color: var(--muted); }
  .empty { color: var(--muted); padding: 24px 14px; text-align: center; line-height: 1.5; }
  footer { padding: 6px 12px 8px; color: var(--muted); font-size: 11px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; }
  button.icon-btn { background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 14px; padding: 2px 4px; }
  button.icon-btn:hover { color: var(--text); }
  .row.unnamed { cursor: pointer; }
  .row.unnamed:hover { background: var(--panel); }
  .namer { grid-column: 2 / 4; display: flex; gap: 6px; }
  .namer input { flex: 1; min-width: 0; padding: 5px 8px; border-radius: 6px; border: 1px solid var(--accent);
    background: var(--panel); color: var(--text); font: inherit; outline: none; }
  .namer button { padding: 5px 9px; border-radius: 6px; border: 0; background: var(--accent); color: #062a22; font: inherit; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>
<div class="app">
  <header>
    <span class="dot" id="dot" title="Waiting for game traffic"></span>
    <h1>Pet Tracker</h1>
    <label class="hide"><input type="checkbox" id="hideMax"> Hide maxed</label>
    <button class="icon-btn" id="searchBtn" title="Search">&#x2315;</button>
  </header>
  <div class="tabs">
    <button class="tab" data-tab="recent">Recent</button>
    <button class="tab" data-tab="nearby">Nearby</button>
    <button class="tab" data-tab="all">All</button>
  </div>
  <input class="search" id="search" placeholder="Search pets" autocomplete="off">
  <div class="list" id="list"></div>
  <datalist id="petnames"></datalist>
  <footer><span id="status">Starting…</span><span id="hint"></span></footer>
</div>
<script>
(() => {
  let view = null, naming = 0, petNames = [];
  const lastSouls = new Map();
  const $ = id => document.getElementById(id);
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  };
  let tab = store.get('tab', 'nearby');
  $('hideMax').checked = store.get('hideMax', false);

  document.querySelectorAll('.tab').forEach(b => b.onclick = () => { tab = b.dataset.tab; store.set('tab', tab); render(); });
  $('hideMax').onchange = () => { store.set('hideMax', $('hideMax').checked); render(); };
  $('searchBtn').onclick = () => {
    const s = $('search'); s.classList.toggle('show');
    if (s.classList.contains('show')) s.focus(); else { s.value = ''; render(); }
  };
  $('search').oninput = render;

  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const ago = s => s < 0 ? '' : s < 60 ? s + 's ago' : s < 3600 ? Math.floor(s / 60) + 'm ago' : Math.floor(s / 3600) + 'h ago';

  function row(p) {
    const known = p.need >= 0;
    const pct = p.max ? 100 : known && p.need ? Math.min(100, p.souls / p.need * 100) : 0;
    const icon = p.icon ? `style="background-image:url('${esc(p.icon)}')"` : '';
    const right = p.max ? '<span class="chip">✓ MAX</span>'
      : known ? `<span class="count">${p.souls} / ${p.need}</span>` : '<span class="count">?</span>';
    let sub = known ? (p.level === 0 ? 'Not unlocked' : 'Rank ' + p.level) : 'Not tracked yet';
    const unnamed = false;
    if (tab === 'recent' && p.ago >= 0) sub += ' · ' + ago(p.ago) + (p.session ? ` · +${p.session}` : '');
    let hint = '';
    if (tab === 'nearby' && p.nearby) hint = `<span class="hint near">${p.nearby} nearby</span>`;
    if (!p.max && known && p.killsLeft > 0) {
      if (hint) sub += ` · ~${p.killsLeft} kills`;
      else hint = `<span class="hint">~${p.killsLeft} kills</span>`;
    }
    const sig = p.souls + p.level * 1000;
    const flash = p.id && lastSouls.has(p.id) && lastSouls.get(p.id) !== sig ? ' flash' : '';
    if (naming && naming === p.id) return `<div class="row">
      <div class="icon">?</div>
      <div class="namer"><input id="nameInput" list="petnames" placeholder="Which pet is this? (${p.souls}/${p.need})">
      <button id="nameSave">Save</button></div>
      <div class="sub" style="grid-column:2/4">Pick the pet whose window shows ${p.souls}/${p.need}, rank ${p.level}</div>
    </div>`;
    return `<div class="row${p.max ? ' max' : ''}${flash}${unnamed ? ' unnamed' : ''}"${unnamed ? ` data-id="${p.id}"` : ''}>
      <div class="icon" ${icon}>${p.icon ? '' : '?'}</div>
      <div class="name" title="${esc(p.name)}">${esc(p.name)}</div>${right}
      <div class="sub">${esc(sub)}</div>${hint || '<span></span>'}
      ${known ? `<div class="bar"><i style="width:${pct}%"></i></div>` : ''}
    </div>`;
  }

  async function loadNames() {
    try { petNames = await (await fetch('/api/pets')).json(); } catch { petNames = []; }
    $('petnames').innerHTML = petNames.map(n => `<option value="${esc(n.name)}">${esc(n.genus)}</option>`).join('');
  }
  $('list').addEventListener('click', e => {
    const r = e.target.closest('.row.unnamed');
    if (r && !naming) { naming = +r.dataset.id; if (!petNames.length) loadNames(); render(); const i = $('nameInput'); if (i) i.focus(); }
  });
  $('list').addEventListener('click', async e => {
    if (e.target.id !== 'nameSave') return;
    const v = $('nameInput').value.trim().toLowerCase();
    const hit = petNames.find(n => n.name.toLowerCase() === v);
    if (hit) await fetch('/api/name', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: naming, slug: hit.slug }) });
    naming = 0; render();
  });
  $('list').addEventListener('keydown', e => {
    if (e.target.id === 'nameInput' && e.key === 'Enter') $('nameSave').click();
    if (e.target.id === 'nameInput' && e.key === 'Escape') { naming = 0; render(); }
  });

  function render() {
    if (naming && document.activeElement && document.activeElement.id === 'nameInput') return; // don't wipe the editor while typing
    document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
    const list = $('list');
    if (!view) { list.innerHTML = '<div class="empty">Starting…</div>'; return; }
    let items = view[tab] || [];
    const q = $('search').value.trim().toLowerCase();
    if (q) {
      const seen = new Set();
      items = (view.all || []).concat(view.nearby || []).filter(p => {
        const k = p.id || p.slug;
        if (seen.has(k) || !p.name.toLowerCase().includes(q)) return false;
        seen.add(k); return true;
      });
    }
    if ($('hideMax').checked) items = items.filter(p => !p.max);
    if (!items.length) {
      const msg = q ? 'No pets match.'
        : !view.live ? 'Waiting for the game…<br>Start Pet Tracker before you log in so it sees your pet list.'
        : !view.haveList && tab === 'all' ? 'Go to character select and log back in so the tracker can read your pet list.'
        : tab === 'recent' ? 'No souls picked up yet this session.'
        : tab === 'nearby' ? 'No pet monsters around you right now.'
        : 'Nothing to show.';
      list.innerHTML = `<div class="empty">${msg}</div>`;
    } else {
      list.innerHTML = items.map(row).join('');
    }
    (view.all || []).forEach(p => lastSouls.set(p.id, p.souls + p.level * 1000));
    $('dot').classList.toggle('live', !!view.live);
    $('dot').title = view.live ? 'Reading game traffic' : 'Waiting for game traffic';
    $('status').textContent = view.live ? 'Live' : 'Waiting for game…';
    $('hint').textContent = view.haveList ? `${(view.all || []).filter(p => p.level > 0).length} pets owned` : 'pet list not seen yet';
  }

  function connect() {
    const es = new EventSource('/api/events');
    es.onmessage = e => { try { view = JSON.parse(e.data); render(); } catch {} };
    es.onerror = () => {
      $('status').textContent = 'Tracker stopped'; $('dot').classList.remove('live');
      es.close(); setTimeout(connect, 3000);
    };
  }
  render();
  connect();
})();
</script>
</body>
</html>
